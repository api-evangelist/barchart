  /getSignal.json:
    get:
      tags:
      - Charts and Analytics
      summary: getSignal
      operationId: get-getSignal
      description: The getSignal API provides the Barchart Technical Opinion / Signal (buy, sell or hold) based on a variety of short, medium and long-term technical indicators based on a symbol.
      parameters:
      - in: query
        name: apikey
        description: Enter the secret API key.
        required: true
        schema:
          type: string
          example: YOUR_API_KEY
      - in: query
        name: symbols
        description: A symbol or code that identifies a financial instrument. Multiple symbols separated by a comma may be used. For futures, notation such as <root_symbol*0> for the active contract or <root_symbol*1> for the first nearby is supported, as is <root_symbol^F> for all futures contracts for a given root symbol, as is <root_symbol^O> for all options contracts for a given underlying futures symbol.
        required: true
        schema:
          type: string
          example: AAPL,GOOG
      - in: query
        name: fields
        description: The fields requested.
        required: false
        schema:
          type: string
          example: trendspotterOpinion,adi7DayOpinion,parabolic50DaySignal
      - in: query
        name: maxRecords
        description: The maximum number of records to show in the return.
        required: false
        schema:
          type: integer
          example: 10
      responses:
        '200':
          description: OK (Success)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    description: The status object when an error occurs or when a response is successful.
                    required:
                    - code
                    - message
                    properties:
                      code:
                        description: The status code of the response.
                        type: integer
                        example: 200
                      message:
                        description: The status message corresponding to the status code.
                        type: string
                        example: Success.
                  results:
                    description: The results object of the API operation.
                    type: array
                    uniqueItems: true
                    items:
                      type: object
                      properties:
                        symbol:
                          description: A symbol or code that identifies a financial instrument.
                          type:
                          - string
                          - 'null'
                          example: AAPL
                        name:
                          description: The full name of the instrument.
                          type:
                          - string
                          - 'null'
                          example: Apple Inc
                        trendspotterOpinion:
                          description: The Trend Seeker&#174; (composite indicator) buy, sell or hold opinion.
                          type:
                          - string
                          - 'null'
                          example: Sell
                        trendspotterStrength:
                          description: The Trend Seeker&#174; Strength
                          type:
                          - string
                          - 'null'
                          example: Maximum
                        trendspotterDirection:
                          description: The Trend Seeker&#174; Direction
                          type:
                          - string
                          - 'null'
                          example: Strongest
                        adx7DayOpinion:
                          description: 7-day Average Directional Indicator (short-term indicator) buy, sell or hold signal.
                          type:
                          - string
                          - 'null'
                          example: Sell
                        adx7DayStrength:
                          description: 7-Day Average Strengthal Indicator Strength
                          type:
                          - string
                          - 'null'
                          example: Maximum
                        adx7DayDirection:
                          description: 7 Day Average Directional Indicator Direction
                          type:
                          - string
                          - 'null'
                          example: Strongest
                        maHiLo10_8DayOpinion:
                          description: 10 - 8 Day Moving Average Hilo Channel (short-term indicator) buy, sell or hold signal.
                          type:
                          - string
                          - 'null'
                          example: Sell
                        maHiLo10_8DayStrength:
                          description: 10 - 8 Day Moving Average Hilo Channel Strength
                          type:
                          - string
                          - 'null'
                          example: Strong
                        maHiLo10_8DayDirection:
                          description: 10 - 8 Day Moving Average Hilo Channel Direction
                          type:
                          - string
                          - 'null'
                          example: Strongest
                        ma20DaySignal:
                          description: 20-Day Moving Average vs Price Indicator (short-term indicator) buy, sell or hold signal.
                          type:
                          - string
                          - 'null'
