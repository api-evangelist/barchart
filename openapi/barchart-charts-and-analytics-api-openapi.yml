  /getMomentum.json:
    get:
      tags:
      - Charts and Analytics
      summary: getMomentum
      operationId: get-getMomentum
      description: The getMomentum API provides a daily summary on the number of advancing, declining and unchanged stocks, as well as the percentage of stocks above moving averages of different lengths.
      parameters:
      - in: query
        name: apikey
        description: Enter the secret API key.
        required: true
        schema:
          type: string
          example: YOUR_API_KEY
      - in: query
        name: country
        description: A country code identifying a group of stocks listed in a country.
        required: false
        schema:
          type: string
          example: US
      - in: query
        name: exchanges
        description: The code for the exchange a group of financial instruments are listed on.
        required: false
        schema:
          type: string
          example: NASDAQ
